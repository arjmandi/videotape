[project]
name = "contrail"
version = "0.1.0"
description = "A flight booking demo written as a Videotape screenplay."
requires-python = ">=3.12"
dependencies = ["videotape[qwen]"]

[dependency-groups]
dev = ["pyright"]

[tool.uv.sources]
videotape = { path = "../..", editable = true }

[tool.videotape]
screenplay = "contrail.screenplay:app"
model = "gemini-omni-flash-1.2"
takes = 4
cap_usd = 200

[tool.pyright]
typeCheckingMode = "strict"

[project]
name = "videotape"
version = "0.1.0"
description = "Write an app as a screenplay of scenes and actions; render it into a tape of clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
videotape = "videotape.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videotape"]

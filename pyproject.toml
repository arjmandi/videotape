[project]
name = "videotape"
version = "0.1.0"
description = "Write an app as a screenplay of scenes and actions; render it into a tape of clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
qwen = ["accelerate>=1.0", "pillow>=11", "torch>=2.5", "torchvision>=0.20", "transformers>=4.57"]
# diffusers runs TI2V-5B. The rest is what importing VideoX-Fun (pinned in videotape/wan.py) needs at import time;
# its own requirements.txt also lists gradio, datasets, tensorboard and decord, which the render never touches.
wan = [
    "diffusers==0.42.1",
    "transformers>=4.57",
    "torch>=2.5",
    "torchvision>=0.20",
    "accelerate>=1.0",
    "huggingface_hub>=0.34",
    "pillow>=11",
    "numpy>=2",
    "safetensors>=0.4",
    "einops>=0.8",
    "omegaconf>=2.3",
    "opencv-python-headless>=4.10",
    "imageio>=2.35",
    "librosa>=0.10",
    "func_timeout>=4.3",
    "ftfy>=6.2",
    "sentencepiece>=0.2",
    "requests>=2.32",
]

[project.scripts]
videotape = "videotape.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videotape"]

# TapePlayer's source, which play and publish build: what a Release build reads, and none of its tests or build output.
# player.LEFT_OUT says the same of clients/macos, and tests/test_package.py holds the two together.
[tool.hatch.build.targets.wheel.force-include]
"clients/macos/build.sh" = "videotape/macos/build.sh"
"clients/macos/TapeKit/Package.swift" = "videotape/macos/TapeKit/Package.swift"
"clients/macos/TapeKit/Sources" = "videotape/macos/TapeKit/Sources"
"clients/macos/TapePlayer" = "videotape/macos/TapePlayer"
"clients/macos/TapePlayer.xcodeproj/project.pbxproj" = "videotape/macos/TapePlayer.xcodeproj/project.pbxproj"
"clients/macos/TapePlayer.xcodeproj/xcshareddata/xcschemes" = "videotape/macos/TapePlayer.xcodeproj/xcshareddata/xcschemes"

[tool.pytest.ini_options]
markers = ["qwen: runs the real Qwen3-VL-8B model; needs the qwen extra, the weights, and a CUDA or MPS GPU"]
addopts = "-m 'not qwen'"

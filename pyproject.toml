[project]
name = "videotape"
version = "0.1.0"
description = "Write an app as a screenplay of scenes and actions; render it into a tape of clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
qwen = ["accelerate>=1.0", "pillow>=11", "torch>=2.5", "torchvision>=0.20", "transformers>=4.57"]

[project.scripts]
videotape = "videotape.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videotape"]

[tool.pytest.ini_options]
markers = ["qwen: runs the real Qwen3-VL-8B model; needs the qwen extra, the weights, and a CUDA or MPS GPU"]
addopts = "-m 'not qwen'"
